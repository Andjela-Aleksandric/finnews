# FinNews: na svakih 30 minuta osvežava vesti, cene i radove i objavljuje sajt na GitHub Pages.
name: FinNews sajt
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: finnews-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Drži raspored aktivnim (GitHub gasi zakazane poslove posle 60 dana bez izmena)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable site.yml -R ${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: Vrati bazu iz prethodnog pokretanja
        uses: actions/cache/restore@v4
        with:
          path: .data
          key: finnews-db-${{ github.run_id }}
          restore-keys: finnews-db-
      - name: Vesti, prevodi, akcije, istraživanja
        env:
          FINNEWS_DATA: .data
          OUT: web/public/data
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN }}
          FINNEWS_REPO: ${{ vars.DATA_REPO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python site_build.py
      - name: Sačuvaj bazu
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data
          key: finnews-db-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Napravi sajt
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
