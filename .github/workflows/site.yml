# FinNews: na svakih 30 minuta osvežava vesti, cene i radove i objavljuje sajt na GitHub Pages.
name: FinNews sajt
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: finnews-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Drži raspored aktivnim (GitHub gasi zakazane poslove posle 60 dana bez izmena)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable site.yml -R ${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: Vrati bazu iz prethodnog pokretanja
        uses: actions/cache/restore@v4
        with:
          path: .data
          key: finnews-db-${{ github.run_id }}
          restore-keys: finnews-db-
      - name: Keš lokalnog AI modela
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3.5-4b-v1
      - name: Besplatan lokalni AI (Ollama, Qwen 3.5 4B)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          export OLLAMA_MODELS="$HOME/.ollama/models"
          if ! curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr/local; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          sudo pkill -f "ollama serve" || true
          sleep 1
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen3.5:4b
          ollama list
      - name: Vesti, prevodi, akcije, istraživanja
        env:
          FINNEWS_DATA: .data
          OUT: web/public/data
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN }}
          FINNEWS_REPO: ${{ vars.DATA_REPO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FINNEWS_OLLAMA_MODEL: qwen3.5:4b
          LOCAL_AI_BUDGET: "1080"
        run: python site_build.py
      - name: Sačuvaj bazu
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data
          key: finnews-db-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Napravi sajt
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # GitHub često kasni ili preskače zakazana pokretanja (nekad i satima), pa svako pokretanje pokrene "tick",
  # koji sačeka ~30 minuta od početka ovog pokretanja i zatim pokrene sledeće osvežavanje.
  next:
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Zakaži sledeće osvežavanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml -R ${{ github.repository }} --ref main -f started="$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)"
