name: trtest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || true
      - run: |
          python - <<'PY'
          import ai, translate_fix as t
          S=["Microsoft says services fully restored after global outage hits governments The Guardian Microsoft’s Global outage blamed on technical issue Reuters",
             "Israeli Strikes on Gaza Hospital Kill 6 and Injure Dozens, Health Officials Say The New York Times Israeli strike on hospital kills at least 5 including doctor and child, officials say AP News",
             "US home sales fall to lowest level since 2010 as mortgage rates soar CNBC October Home Sales Plunge to 16-Year Low WSJ"]
          for x in S:
              p=t.protect_names(t.simplify_en(x)); print("PROT", p)
              try: print("GTX ", ai.gtx(p[0],"sr"))
              except Exception as e: print("GTX ERR", e)
              try: print("MANY", ai.gtx_many([p[0],"Stocks rose."],"sr"))
              except Exception as e: print("MANY ERR", e)
              print("FREE", ai._free_translate([("Naslov test", x)],"sr")[0][1]); print()
          PY
