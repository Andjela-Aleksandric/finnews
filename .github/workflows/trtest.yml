name: trtest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || true
      - run: |
          python - <<'PY'
          import ai
          T=["SpaceX's S&P 500 Bid Gets New Life as Musk Floats Tesla Merger","Fed's Collins Says 'Steady, Gradual' Rate Increase Is Appropriate",
          "World Economy Latest: US Inflation Report Supports Fed Rate Hike","Bessent, Lutnick Clash Over Nvidia China Curbs",
          "Nvidia's Board Failed Jensen Huang: Randall Peterson","How Wall Street Is Preparing for a Post-Jensen Huang Nvidia Era",
          "Elon Musk joins 100,000+ signers on a petition to reinstate Jensen Huang","New York Fed Survey Shows Higher Inflation Expectations",
          "Apple Shares Fall After China Sales Slump","Target Cuts Outlook as Shoppers Pull Back","Treasury Yields Climb as Traders Pare Fed Cut Bets","Bank of England's Bailey Warns on Sticky Inflation","John Williams Says Fed Policy Is Well Positioned",
          "Alphabet Rises as Google Cloud Growth Beats Estimates","Fed's Barr Says Banks Face New Risks From Private Credit",
          "Powell says the Fed will stay patient as Goldman Sachs and JPMorgan raise forecasts"]
          for (a,_),x in zip(ai._free_translate([(t,"") for t in T],"sr"),T): print(x,"\n  ->",a)
          PY
